databases:
  - name: sema-mt-db
    databaseName: sema_mt
    user: sema_mt

services:
  - type: web
    name: sema-mt-v93
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sema-mt-db
          property: connectionString
