{% extends "base.html" %}{% block c %}<div class="card"><h1>Questões</h1>{% if resultado %}<div class="notice card"><h2>Resultado: {{resultado[0]}} de {{resultado[1]}}</h2></div>{% endif %}<form method="post">{% for q in qs %}<div class="card"><small>{{q.disciplina}}</small><h3>{{loop.index}}. {{q.enunciado}}</h3>{% for l in ["A","B","C","D"] %}<label class="opt"><input type="radio" name="{{q.id}}" value="{{l}}"> {{l}} — {{q[l|lower]}}</label>{% endfor %}</div>{% endfor %}<button>Finalizar e corrigir</button></form></div>{% endblock %}
